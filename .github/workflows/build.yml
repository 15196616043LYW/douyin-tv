name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时需要创建 Release

jobs:
  build:
    # 固定 runner 版本，避免 ubuntu-latest 迁移（26.04）后行为漂移
    runs-on: ubuntu-24.04

    env:
      # secrets 不能直接写在 if 里，先落到 env 再判断
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle (with cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses and install packages
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Decode keystore
      if: env.HAS_KEYSTORE == 'true'
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Align and sign Release APK
      if: env.HAS_KEYSTORE == 'true'
      run: |
        BT="${ANDROID_HOME}/build-tools/34.0.0"

        "$BT/zipalign" -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app/build/outputs/apk/release/app-release-aligned.apk

        "$BT/apksigner" sign \
          --ks release.keystore \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --ks-key-alias douyintv \
          app/build/outputs/apk/release/app-release-aligned.apk

        cp app/build/outputs/apk/release/app-release-aligned.apk \
           app/build/outputs/apk/release/DouyinTV.apk

    - name: Upload build reports (only on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          app/build/reports/**
          app/build/outputs/logs/**
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload Debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTV-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 7

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTV-release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
